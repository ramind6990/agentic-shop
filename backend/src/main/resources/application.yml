spring:
  application:
    name: agenticshop
  # Local secrets (OPENAI_API_KEY, ...) from the project-root .env (git-ignored), KEY=VALUE lines.
  # Both paths are optional: ../.env when started from backend/, .env when started from the repo root.
  # Real environment variables still win over these values.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/agenticshop}
    username: ${DB_USER:agenticshop}
    password: ${DB_PASSWORD:agenticshop}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # schema migrations (V1..V99) added after the seed (V100+) has run must still apply
    out-of-order: true
    placeholders:
      seed_customers: ${SEED_CUSTOMERS:20000}
      seed_sellers: ${SEED_SELLERS:500}
      seed_products: ${SEED_PRODUCTS:50000}
      seed_orders: ${SEED_ORDERS:100000}
      seed_tickets: ${SEED_TICKETS:15000}

app:
  jwt:
    # HS256 key, at least 32 bytes. Override in every non-dev environment.
    secret: ${JWT_SECRET:agenticshop-dev-only-secret-change-me-0123456789}
    ttl: ${JWT_TTL:8h}

  # the ai agent's own model, called through OpenAI's Responses API (/v1/responses);
  # without an API key the app starts, but ai runs fail
  ai:
    # Dev-only /api/ai/dev/tools endpoints (run one tool without the model). Never enable in production.
    dev-endpoints: ${AI_DEV_ENDPOINTS:false}
    model:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${AI_CHAT_MODEL:gpt-6-luna}
      max-output-tokens: 4000
      # none | minimal | low | medium | high; unset = the model's default
      reasoning-effort: ${AI_REASONING_EFFORT:}
      timeout: 60s
      log-requests: false
      log-responses: false
      # transient errors (rate limits, timeouts, 5xx, network) of the agent's model calls; the user sees
      # "Request failed. Retrying (n/max)". Backoff doubles from initial-backoff up to max-backoff (±20% jitter).
      retry:
        max-retries: ${AI_MODEL_MAX_RETRIES:5}
        initial-backoff: 1s
        max-backoff: 20s
    # budget of one run: once its model calls used this many tokens (input + output), the next call answers without tools
    run:
      max-tokens: ${AI_RUN_MAX_TOKENS:200000}
    # system prompt: prompts/ai/<version>/base.md + customer.md / staff.md (or prompts/ai/system-<version>.md)
    prompt:
      version: ${AI_PROMPT_VERSION:v4}
    # limits of the final reply: told to the model in the prompt and enforced by the output validation
    reply:
      max-text-length: 600
      max-suggestions: 3
      max-suggestion-label-length: 40
    # conversation memory: older messages are folded into a summary (inside the next run, when due)
    memory:
      summarize-after: ${AI_SUMMARIZE_AFTER:20}
      keep-recent: ${AI_KEEP_RECENT:6}
      max-summary-chars: 3000
      # a summary longer than this closes the conversation (new messages: "start a new one")
      hard-limit-chars: ${AI_SUMMARY_HARD_LIMIT:6000}
      prompt-version: v2
    # guardrails; each mode is OFF | SHADOW (trace only) | ENFORCE
    guard:
      # model of the guards' own calls (injection classifier, reply auditor); unset = the agent's model
      model-name: ${AI_GUARD_MODEL:gpt-6-luna}
      # the user's message and typed answers: direct prompt injection
      input:
        mode: ENFORCE
        classifier: true
      # @FreeText fields of tool results (reviews, ticket messages, ...): indirect injection, PII
      tool-output:
        injection: ENFORCE
        classifier: true
        redact-pii: true
        cache-size: 1000
      # the final reply
      output:
        grounding: ENFORCE
        amounts: SHADOW
        links: ENFORCE
        auditor: ENFORCE
        # hosts a reply may link to; empty = no links
        allowed-link-hosts: []
        evidence-chars: 12000
      # loop detection; an escalated customer run is handed over to support (escalate_to_human, approved by them)
      loop:
        enabled: true
        max-failures-per-tool: 2
        max-tool-errors: 3
        max-calls-per-read-tool: 5
        max-idle-steps: 2
    # what the chat's usage bar measures against, in tokens (shown as percentages; nothing is blocked)
    usage:
      # one conversation's model calls over its lifetime
      chat-token-limit: ${AI_CHAT_TOKEN_LIMIT:1000000}
      # its history (summary + messages after it) as the next message gets it
      context-token-limit: ${AI_CONTEXT_TOKEN_LIMIT:200000}
    # LLM tracing to Langfuse (OTLP over HTTP; ai runs only, prompts and replies PII-redacted). Off unless enabled
    # and both keys are set; keys from the project's Langfuse settings (EU cloud by default).
    langfuse:
      enabled: ${LANGFUSE_ENABLED:false}
      base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      environment: ${LANGFUSE_ENVIRONMENT:development}
    # live run events (/api/ai/runs/{runId}/events), in memory
    events:
      # closed streams stay replayable this long, so a late reconnect still gets the last event
      retention: 5m
      buffer-size: 2000
      heartbeat: 15s
      # a stream still open after this is closed (a hung run)
      max-open: 10m
    # chat WebSocket (/api/ai/ws?connectToken=..., token from POST /api/ai/ws/connect-tokens)
    ws:
      allowed-origins: ${AI_WS_ALLOWED_ORIGINS:http://localhost:4200}
      connect-token-ttl: 30s
      max-message-bytes: 16384
      # a slow client is disconnected once a send blocks this long or this much output is buffered
      send-time-limit: 10s
      send-buffer-bytes: 524288
      # server pings keep proxies happy; no incoming traffic (pongs included) for idle-timeout closes the socket
      ping-interval: 15s
      idle-timeout: 60s

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Schema only, no fake data
spring:
  config:
    activate:
      on-profile: noseed
  flyway:
    locations: classpath:db/migration
