<app-page-header title="Products" [subtitle]="subtitle()">
  <form class="d-flex flex-wrap gap-2" role="search" (submit)="onSearch($event, searchInput.value)">
    <div>
      <label for="product-q" class="visually-hidden">Search product titles</label>
      <input
        #searchInput
        id="product-q"
        type="search"
        class="form-control form-control-sm"
        placeholder="Search titles"
        [value]="store.query().q"
      />
    </div>
    <div class="d-flex align-items-center gap-2">
      <label for="product-sort" class="small text-body-secondary text-nowrap">Sort by</label>
      <select id="product-sort" class="form-select form-select-sm" (change)="onSort($event)">
        @for (option of sortOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.query().sort">
            {{ option.label }}
          </option>
        }
      </select>
    </div>
  </form>
</app-page-header>

<div class="row g-4 page-fill-body">
  <div class="col-lg-4 col-xl-3 scroll-pane">
    <app-product-filters />
  </div>

  <section
    #resultsPane
    class="col-lg-8 col-xl-9 scroll-pane"
    aria-label="Search results"
    tabindex="0"
  >
    <app-load-state
      [loading]="store.resultsLoading()"
      [error]="store.resultsError()"
      [hasValue]="!!store.results()"
      (retry)="store.reload()"
    >
      @if (store.results(); as result) {
        @if (result.content.length > 0) {
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xxl-4 g-3 mb-4">
            @for (product of result.content; track product.id) {
              <div class="col">
                <app-product-card [product]="product" [priority]="$index < 4" />
              </div>
            }
          </div>

          <app-pager
            class="d-block mb-3"
            [page]="result.page"
            [size]="result.size"
            [totalElements]="result.totalElements"
            [totalPages]="result.totalPages"
            (pageChange)="onPage($event)"
          />
        } @else {
          <div class="panel p-4 text-center">
            <p class="mb-2">No products match this search.</p>
            @if (store.hasFilters()) {
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                (click)="store.clearFilters()"
              >
                Clear filters
              </button>
            }
          </div>
        }
      }
    </app-load-state>
  </section>
</div>
