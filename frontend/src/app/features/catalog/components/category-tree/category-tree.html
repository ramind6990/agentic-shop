<ng-template #branch let-nodes>
  <ul class="tree">
    @for (node of nodes; track node.id) {
      <li>
        @if (node.leaf) {
          <a class="leaf" routerLink="/products" [queryParams]="{ categoryId: node.id }">{{
            node.name
          }}</a>
          <span class="meta">#{{ node.id }}</span>
        } @else {
          <details [open]="node.level === 0">
            <summary>
              <span class="fw-semibold">{{ node.name }}</span>
              <span class="meta"
                >{{ node.children.length }} {{ node.level === 0 ? 'groups' : 'categories' }}</span
              >
            </summary>
            <ng-container
              [ngTemplateOutlet]="branch"
              [ngTemplateOutletContext]="{ $implicit: node.children }"
            />
          </details>
        }
      </li>
    }
  </ul>
</ng-template>

<ng-container [ngTemplateOutlet]="branch" [ngTemplateOutletContext]="{ $implicit: nodes() }" />
