<app-list-layout
  title="Tickets"
  noun="tickets"
  [result]="store.result()"
  [loading]="store.loading()"
  [error]="store.error()"
  (pageChange)="store.list.setPage($event)"
  (retry)="store.reload()"
>
  <form slot="filters" class="row g-2 align-items-end" role="search" aria-label="Filter tickets">
    <div class="col-12 col-md-4 col-xl-2">
      <label for="tk-q" class="form-label small mb-1">Subject or number</label>
      <input
        id="tk-q"
        appFilter="q"
        type="search"
        class="form-control form-control-sm"
        placeholder="TCK-0048213"
      />
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <label for="tk-status" class="form-label small mb-1">Status</label>
      <select id="tk-status" appFilter="status" class="form-select form-select-sm">
        <option value="">Any</option>
        @for (o of store.statusOptions(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <label for="tk-priority" class="form-label small mb-1">Priority</label>
      <select id="tk-priority" appFilter="priority" class="form-select form-select-sm">
        <option value="">Any</option>
        @for (o of store.priorityOptions(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="tk-category" class="form-label small mb-1">Category</label>
      <select id="tk-category" appFilter="category" class="form-select form-select-sm">
        <option value="">Any category</option>
        @for (o of store.categoryOptions(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <label for="tk-tier" class="form-label small mb-1">Tier</label>
      <select id="tk-tier" appFilter="tier" class="form-select form-select-sm">
        <option value="">Any</option>
        <option value="T1">Tier 1</option>
        <option value="T2">Tier 2</option>
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="tk-assignee" class="form-label small mb-1">Assignee</label>
      <select id="tk-assignee" appFilter="assigneeId" class="form-select form-select-sm">
        <option value="">Anyone</option>
        @for (a of store.agents(); track a.id) {
          <option [value]="a.id">
            {{ a.fullName }} ({{ a.role === 'SUPPORT_T2' ? 'T2' : 'T1' }})
          </option>
        }
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <label for="tk-seller" class="form-label small mb-1">Seller ID</label>
      <input
        id="tk-seller"
        appFilter="sellerId"
        type="number"
        min="1"
        class="form-control form-control-sm"
        placeholder="171"
      />
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <label for="tk-customer" class="form-label small mb-1">Customer ID</label>
      <input
        id="tk-customer"
        appFilter="customerId"
        type="number"
        min="1"
        class="form-control form-control-sm"
        placeholder="4859"
      />
    </div>
    <div class="col-6 col-md-4 col-xl-1">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        [disabled]="!store.list.hasFilters()"
        (click)="store.list.clear()"
      >
        Clear
      </button>
    </div>
  </form>

  <app-ticket-table [tickets]="store.rows()" />
</app-list-layout>
