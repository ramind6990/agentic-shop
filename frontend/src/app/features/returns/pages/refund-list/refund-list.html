<app-list-layout
  title="Refunds"
  noun="refunds"
  [result]="store.result()"
  [loading]="store.loading()"
  [error]="store.error()"
  (pageChange)="store.list.setPage($event)"
  (retry)="store.reload()"
>
  <form slot="filters" class="row g-2 align-items-end" role="search" aria-label="Filter refunds">
    <div class="col-6 col-md-4 col-xl-2">
      <label for="ref-status" class="form-label small mb-1">Status</label>
      <select id="ref-status" appFilter="status" class="form-select form-select-sm">
        <option value="">Any status</option>
        @for (o of store.statusOptions(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="ref-order" class="form-label small mb-1">Order ID</label>
      <input
        id="ref-order"
        appFilter="orderId"
        type="number"
        min="1"
        class="form-control form-control-sm"
        placeholder="99504"
      />
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="ref-seller" class="form-label small mb-1">Seller ID</label>
      <input
        id="ref-seller"
        appFilter="sellerId"
        type="number"
        min="1"
        class="form-control form-control-sm"
        placeholder="171"
      />
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="ref-from" class="form-label small mb-1">Created from</label>
      <input id="ref-from" appFilter="from" type="date" class="form-control form-control-sm" />
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <label for="ref-to" class="form-label small mb-1">To</label>
      <input id="ref-to" appFilter="to" type="date" class="form-control form-control-sm" />
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        [disabled]="!store.list.hasFilters()"
        (click)="store.list.clear()"
      >
        Clear
      </button>
    </div>
  </form>

  <app-data-table
    caption="Refunds, newest first"
    [rows]="store.rows()"
    [columns]="columns"
    [rowId]="rowId"
  />
</app-list-layout>
