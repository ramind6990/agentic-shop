<app-list-layout title="Orders" noun="orders" [result]="result">
  <form slot="filters" class="row g-2 align-items-end" role="search" aria-label="Filter orders">
    <div class="col-12 col-md-6 col-xl-2">
      <label for="order-q" class="form-label small mb-1">Order number</label>
      <input id="order-q" type="search" class="form-control form-control-sm" placeholder="AS-250314-004521" />
    </div>
    <div class="col-6 col-md-3 col-xl-2">
      <label for="order-status" class="form-label small mb-1">Status</label>
      <select id="order-status" class="form-select form-select-sm">
        <option value="">Any status</option>
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="col-6 col-md-3 col-xl-2">
      <label for="order-seller" class="form-label small mb-1">Seller</label>
      <select id="order-seller" class="form-select form-select-sm">
        <option value="">Any seller</option>
        @for (seller of sellers; track seller.id) {
          <option [value]="seller.id">{{ seller.name }}</option>
        }
      </select>
    </div>
    <div class="col-12 col-md-6 col-xl-1">
      <label for="order-customer" class="form-label small mb-1">Customer ID</label>
      <input id="order-customer" type="number" class="form-control form-control-sm" placeholder="1204" />
    </div>
    <div class="col-6 col-md-3 col-xl-2">
      <label for="order-from" class="form-label small mb-1">From</label>
      <input id="order-from" type="date" class="form-control form-control-sm" />
    </div>
    <div class="col-6 col-md-3 col-xl-2">
      <label for="order-to" class="form-label small mb-1">To</label>
      <input id="order-to" type="date" class="form-control form-control-sm" />
    </div>
    <div class="col-12 col-xl-1 d-flex">
      <button type="reset" class="btn btn-sm btn-outline-secondary w-100">Clear</button>
    </div>
  </form>

  <app-order-table [orders]="result.content" />
</app-list-layout>
