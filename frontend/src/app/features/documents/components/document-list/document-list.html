<div class="panel">
  <form class="d-flex flex-column gap-2 p-3 border-bottom" role="search" aria-label="Filter documents">
    <div>
      <label for="doc-q" class="visually-hidden">Search document titles</label>
      <input id="doc-q" type="search" class="form-control form-control-sm" placeholder="Search titles" />
    </div>
    <div>
      <label for="doc-type" class="visually-hidden">Document type</label>
      <select id="doc-type" class="form-select form-select-sm">
        <option value="">All types</option>
        @for (option of typeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </form>

  <nav class="py-2" aria-label="Documents">
    @for (group of groups(); track group.type) {
      <div class="section-label px-3 pt-2 pb-1" [id]="'doc-group-' + group.type">{{ group.label }}</div>
      <ul class="list-unstyled mb-2" [attr.aria-labelledby]="'doc-group-' + group.type">
        @for (doc of group.documents; track doc.code) {
          <li>
            <a
              class="doc-link"
              [routerLink]="['/documents', doc.code]"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
            >
              <span class="d-block text-truncate">{{ doc.title }}</span>
              <span class="d-block small text-body-secondary font-monospace text-truncate">{{ doc.code }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</div>
